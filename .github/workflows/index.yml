name: index

# Nightly, well after midnight UTC so the previous day is complete. Entirely out
# of band from the recorder: a failure here delays the digest and costs nothing on
# the tape.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Digest date (YYYY-MM-DD). Defaults to yesterday."
        required: false

permissions:
  contents: read

concurrency:
  group: tape-index
  cancel-in-progress: false

jobs:
  # Holds the object-store credentials and CANNOT write to the repository.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      date: ${{ steps.build.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # `inputs.date` reaches this job through the ENVIRONMENT, never interpolated
      # into the shell line. A workflow_dispatch input is attacker-controlled the
      # moment anyone gains write access, and this job holds every secret — an
      # unquoted ${{ }} in a run: block is the classic Actions injection. main.ts
      # additionally rejects anything that is not YYYY-MM-DD.
      - name: Build index and render digest
        id: build
        run: |
          if [ -n "${DATE:-}" ]; then
            node src/main.ts index --date "$DATE"
          else
            node src/main.ts index
          fi
        env:
          DATE: ${{ inputs.date }}
          TAPE_PII_SALT: ${{ secrets.TAPE_PII_SALT }}
          TAPE_S3_ENDPOINT: ${{ secrets.TAPE_S3_ENDPOINT }}
          TAPE_S3_REGION: ${{ secrets.TAPE_S3_REGION }}
          TAPE_S3_BUCKET: ${{ secrets.TAPE_S3_BUCKET }}
          TAPE_S3_KEY_ID: ${{ secrets.TAPE_S3_KEY_ID }}
          TAPE_S3_SECRET: ${{ secrets.TAPE_S3_SECRET }}
          TAPE_REPO_URL: ${{ secrets.TAPE_REPO_URL }}
          TAPE_CONTACT: ${{ secrets.TAPE_CONTACT }}

      # Only the ONE day just rendered crosses to the publish job. Uploading the
      # whole digests/ directory would have let publish re-commit every previously
      # published digest, so a bug in one build could silently rewrite history.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest
          path: |
            digests/${{ steps.build.outputs.date }}.md
            digests/${{ steps.build.outputs.date }}.json
          if-no-files-found: error
          retention-days: 7

      # Transcribes the day's run manifests into a hash-chained ledger line per
      # run. This mode ALWAYS exits zero, even over a broken chain: the day the
      # chain breaks must not also be the day the evidence fails to reach git.
      # The alarm is raised in `publish`, after the commit.
      #
      # No TAPE_PII_SALT here. Manifests are counts, keys and hashes — nothing to
      # hash and nothing to redact — so the one secret that cannot be regenerated
      # stays out of a step that has no use for it.
      - name: Transcribe the hash ledger
        run: |
          if [ -n "${DATE:-}" ]; then
            node src/main.ts ledger --date "$DATE"
          else
            node src/main.ts ledger
          fi
        env:
          DATE: ${{ inputs.date }}
          TAPE_S3_ENDPOINT: ${{ secrets.TAPE_S3_ENDPOINT }}
          TAPE_S3_REGION: ${{ secrets.TAPE_S3_REGION }}
          TAPE_S3_BUCKET: ${{ secrets.TAPE_S3_BUCKET }}
          TAPE_S3_KEY_ID: ${{ secrets.TAPE_S3_KEY_ID }}
          TAPE_S3_SECRET: ${{ secrets.TAPE_S3_SECRET }}

      # A SEPARATE artifact from the digest. Sharing one would mean an absent
      # ledger fails the digest upload (if-no-files-found: error) and vice versa,
      # coupling two things that must be able to fail independently.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ledger
          path: ledger/${{ steps.build.outputs.date }}.jsonl
          if-no-files-found: error
          retention-days: 7

  # Holds `contents: write` and NO store credentials. It cannot read the archive,
  # so a bug in the redaction path has nothing to leak — the separation is
  # enforced by which secrets exist in which job, not by discipline.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest
          path: digests/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ledger
          path: ledger/

      # An independent check on bytes the build job produced. The digest module
      # already gates its own output; this does not trust that.
      - name: Refuse to publish anything carrying a personal address
        run: node scripts/pii-audit.ts

      - name: Commit the digest and the ledger
        env:
          DIGEST_DATE: ${{ needs.build.outputs.date }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain digests/ ledger/)" ]; then
            echo "no digest or ledger changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/ ledger/
          git commit -m "tape: digest ${DIGEST_DATE}"
          # Rebase before pushing. Without it a concurrent push to main rejects
          # this one and the day's digest is lost with a green tick — the job
          # succeeds, the commit never lands, and nothing says so.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push rejected, retrying ($attempt)"
            sleep 5
          done
          echo "could not push the digest after 3 attempts" >&2
          exit 1

      # AFTER the commit, deliberately. Evidence before alarm: if this ran first,
      # the day the chain broke would be the day the record of the break failed to
      # reach git, which is the one outcome that makes the ledger worthless.
      #
      # No credentials. That is the public claim being exercised on every run —
      # the chain verifies from the committed files alone, so anyone with a clone
      # can reproduce this exact check without being trusted with anything.
      - name: Verify the chain
        run: node src/main.ts verify-chain
