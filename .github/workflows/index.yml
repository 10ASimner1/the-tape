name: index

# Nightly, well after midnight UTC so the previous day is complete. Entirely out
# of band from the recorder: a failure here delays the digest and costs nothing on
# the tape.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Digest date (YYYY-MM-DD). Defaults to yesterday."
        required: false

permissions:
  contents: read

concurrency:
  group: tape-index
  cancel-in-progress: false

jobs:
  # Holds the object-store credentials and CANNOT write to the repository.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Build index and render digest
        run: node src/main.ts index ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
        env:
          TAPE_PII_SALT: ${{ secrets.TAPE_PII_SALT }}
          TAPE_S3_ENDPOINT: ${{ secrets.TAPE_S3_ENDPOINT }}
          TAPE_S3_REGION: ${{ secrets.TAPE_S3_REGION }}
          TAPE_S3_BUCKET: ${{ secrets.TAPE_S3_BUCKET }}
          TAPE_S3_KEY_ID: ${{ secrets.TAPE_S3_KEY_ID }}
          TAPE_S3_SECRET: ${{ secrets.TAPE_S3_SECRET }}
          TAPE_REPO_URL: ${{ secrets.TAPE_REPO_URL }}
          TAPE_CONTACT: ${{ secrets.TAPE_CONTACT }}

      # Only the rendered digest crosses to the publish job. The index itself and
      # every raw object stay behind.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest
          path: digests/
          if-no-files-found: error
          retention-days: 7

  # Holds `contents: write` and NO store credentials. It cannot read the archive,
  # so a bug in the redaction path has nothing to leak — the separation is
  # enforced by which secrets exist in which job, not by discipline.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest
          path: digests/

      # An independent check on bytes the build job produced. The digest module
      # already gates its own output; this does not trust that.
      - name: Refuse to publish anything carrying a personal address
        run: node scripts/pii-audit.ts

      - name: Commit the digest
        run: |
          if [ -z "$(git status --porcelain digests/)" ]; then
            echo "no digest changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/
          git commit -m "tape: digest $(ls -1 digests/*.md | tail -1 | xargs basename | sed 's/\.md$//')"
          git push
