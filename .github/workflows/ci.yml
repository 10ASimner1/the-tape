name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Lifecycle scripts are the classic malware vector and this project has no
      # need of them — the only dependencies are typescript and @types/node, both
      # dev-only. `--ignore-scripts` is also set in .npmrc so a nested npm
      # invocation cannot quietly re-enable it.
      - name: Install dev dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # No secrets are needed: every test runs against captured fixtures and the
      # local filesystem store, so a fork PR can run the full suite safely.
      - name: Verify no personal address reached the repository
        run: node scripts/pii-audit.ts
